<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Growing in Christ Ministry</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CiAgPHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMxQjZCM0EiLz4KICA8cmVjdCB4PSIyOSIgeT0iMTAiIHdpZHRoPSI2IiBoZWlnaHQ9IjM4IiByeD0iMyIgZmlsbD0id2hpdGUiLz4KICA8cmVjdCB4PSIxNCIgeT0iMjIiIHdpZHRoPSIzNiIgaGVpZ2h0PSI2IiByeD0iMyIgZmlsbD0id2hpdGUiLz4KPC9zdmc+">
  <link rel="stylesheet" href="styles.css">
  <style>
    .error-page {
      min-height: 80vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px;
      background: linear-gradient(135deg, var(--green-deep), var(--green-dark));
    }
    .error-content { max-width: 540px; }
    .error-number {
      font-family: var(--font-display);
      font-size: clamp(5rem, 20vw, 10rem);
      font-weight: 700;
      color: var(--green-light);
      line-height: 1;
      opacity: 0.4;
    }
    .error-content h1 { color: white; font-size: clamp(1.6rem, 4vw, 2.4rem); margin-bottom: 16px; }
    .error-content p  { color: rgba(255,255,255,0.7); margin-bottom: 32px; }
    .error-actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  </style>
</head>
<body>
<div class="error-page">
  <div class="error-content">
    <div class="error-number">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or may have moved. Let's get you back on the right path.</p>
    <div class="error-actions">
      <a href="index.html" class="btn btn-green">Go Home</a>
      <a href="contact.html" class="btn btn-outline-white">Contact Us</a>
    </div>
  </div>
</div>
<script src="layout.js"></script>
</body>
</html>
